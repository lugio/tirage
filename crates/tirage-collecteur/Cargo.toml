[package]
name = "tirage-collecteur"
description = "Service du serveur d'impression : collecte des travaux (spouleur) et des compteurs des copieurs (SNMP)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
tirage-modele = { path = "../tirage-modele" }
tirage-snmp = { path = "../tirage-snmp" }
serde = { workspace = true }
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "std"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[dependencies.serde_json]
workspace = true

[dependencies.tirage-file]
path = "../tirage-file"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Printing",
  "Win32_System_Threading",
]
